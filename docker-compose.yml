version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: bookswap_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookswap
      MYSQL_USER: bookswap_user
      MYSQL_PASSWORD: bookswap_secure_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema_mysql.sql:/docker-entrypoint-initdb.d/schema_mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js Backend Service
  backend:
    build:
      context: ./backend
      target: development
    container_name: bookswap_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: bookswap_super_secret_jwt_key_2026
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: bookswap_user
      MYSQL_PASSWORD: bookswap_secure_password_2026
      MYSQL_DATABASE: bookswap
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  # React Frontend Service (Vite Dev Server)
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: bookswap_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:5000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
