version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: bookswap_prod_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookswap
      MYSQL_USER: bookswap_user
      MYSQL_PASSWORD: bookswap_secure_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./database/schema_mysql.sql:/docker-entrypoint-initdb.d/schema_mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production Backend Service
  backend:
    build:
      context: ./backend
      target: production
    container_name: bookswap_prod_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: bookswap_super_secret_jwt_key_2026
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: bookswap_user
      MYSQL_PASSWORD: bookswap_secure_password_2026
      MYSQL_DATABASE: bookswap
    depends_on:
      mysql:
        condition: service_healthy

  # Production Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: bookswap_prod_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_prod_data:
